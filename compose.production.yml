services:
  loafncatting-api:
    image: loafncatting-api:latest
    container_name: loafncatting-api
    build:
      context: .
      dockerfile: LoafNCatting.Api/Dockerfile
    env_file:
      - .env.production
    ports:
      - "7010:8080"
    restart: unless-stopped
    networks:
      - mascoteach-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  mascoteach-network:
    external: true
    name: mascoteach-network
